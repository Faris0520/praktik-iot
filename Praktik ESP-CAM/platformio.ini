; ============================================================================
; platformio.ini
; Proyek: ESP32-S3 AI Camera (DFRobot DFR1154, sensor OV3660) - VSCode + PlatformIO
; ============================================================================
; Board DFR1154 belum punya definisi khusus di PlatformIO, sehingga kita
; memakai board generik "esp32-s3-devkitc-1" (chip yang sama, ESP32-S3) lalu
; menimpa (override) pengaturan flash & PSRAM agar sesuai modul di board ini:
; 16MB flash dan 8MB PSRAM mode OPI. Ini adalah pendekatan yang lazim dipakai
; untuk board ESP32-S3 custom/pihak ketiga di PlatformIO.
; ============================================================================

[env:esp32-s3-ai-camera]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Override agar sesuai modul ESP32-S3 di board DFR1154 (16MB flash / 8MB OPI PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
; Skema partisi yang setara dengan "Huge APP (3MB No OTA/1MB SPIFFS)" di Arduino IDE
board_build.partitions          = huge_app.csv

; --- Pengaturan USB (setara menu Tools > USB CDC On Boot: Enabled di Arduino IDE) ---
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed  = 921600
; Jika PlatformIO tidak otomatis mendeteksi port board, isi manual, contoh:
; upload_port   = COM5
; monitor_port  = COM5

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
